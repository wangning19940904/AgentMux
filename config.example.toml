# AgentMux configuration (example).
# Copy to config.toml, run `amux config init`, or place it at
# ~/.config/agentmux/config.toml or /etc/agentmux/config.toml.
# ${ENV_VAR} placeholders are expanded from the environment.

display_mode = "normal"  # quiet | compact | normal | full

[server]
addr = "127.0.0.1:8765"

[bridge]
enabled = false
# token = "${BRIDGE_TOKEN}"   # REQUIRED when enabled = true

# ---- SSH remote control ----
# Remote machine profiles are managed in Console -> Machines and saved with
# user-only permissions outside this file.
[remote]
connect_timeout_seconds = 10
# hosts_file = "~/.config/agentmux/remote-hosts.json"

# ---- Projects: pair an agent with one or more IM platforms ----
# Define projects here, or add channels and agent instances from the WebUI.
# Keep the starter config runnable without credentials.
#
# [[projects]]
# name = "demo"
# agent = "claudecode"
# work_dir = "."
# system_prompt = "You are a helpful coding assistant."
# default_model = "sonnet"
#
#   [projects.env]
#   ANTHROPIC_API_KEY = "${MY_KEY}"
#
#   [[projects.platforms]]
#   type = "feishu"
#   app_id = "${FEISHU_APP_ID}"
#   app_secret = "${FEISHU_APP_SECRET}"
#   reply_scope = "dm_and_mentions"  # dm_and_mentions | all | mentions_only
#   reply_mode = "stream_message"    # stream_message | stream_card
#   ack_reaction_enabled = "true"
#   ack_reaction_emojis = "OK,THUMBSUP,MUSCLE,THANKS"
#
#   # Optional VC Agent capability (currently in limited preview):
#   # - Enable the bot capability and card callback configuration.
#   # - Grant tenant scopes vc:meeting.bot.join:write and
#   #   vc:meeting.meetingevent:read. For real-time speech, also request the
#   #   limited-preview vc:meeting.bot.realtime:write scope.
#   # - Subscribe to vc.bot.meeting_invited_v1 and vc.bot.meeting_ended_v1.
#   #   AgentMux sends the inviter an approval card and only joins after that
#   #   user clicks Join.
#   # - The meeting owner must enable "Allow agents to join".
#
#   # Optional path 3: speak streamed Agent answers in the approved meeting.
#   meeting_voice_enabled = "true"
#   meeting_voice_tts_base_url = "https://api.openai.com/v1"
#   meeting_voice_tts_api_key = "${OPENAI_API_KEY}"
#   meeting_voice_tts_model = "gpt-4o-mini-tts"
#   meeting_voice_tts_voice = "alloy"

# Other supported platform types (config.toml projects or the console's
# Channels & Triggers panel):
#   type = "lark"      -> app_id, app_secret (Lark international domain)
#   type = "telegram"  -> token
#   type = "dingtalk"  -> client_id, client_secret[, robot_code]
#   type = "slack"     -> bot_token (xoxb-), app_token (xapp-)
#   type = "discord"   -> token (enable Message Content Intent)
#   type = "webhook"   -> listen, outbound_url
# Channels created in the console are stored in SQLite and attached at
# runtime; cron / inbound-webhook / event triggers are managed there too.

# ---- Lifecycle hooks (config.toml side; the console offers event triggers) ----
# Events: message.received, message.sent, session.started, session.ended,
#         cron.triggered, webhook.triggered, permission.requested, error
# [[hooks]]
# event = "error"
# type = "shell"
# command = "echo error >> /tmp/aib.log"

# ---- Provider management ----
[provider]
failover = true
# Local Routing listen address (cc-switch style takeover proxy). Live configs
# are rewritten to point here when takeover is enabled per tool.
# proxy_addr = "127.0.0.1:15733"

# ---- Token usage analytics ----
[usage]
sources = ["claude", "codex", "cursor", "gemini"]
offline = false
# cache_dir = "~/.cache/agentmux"

# ---- Agent observability ----
# Full content is redacted, compressed and AES-256-GCM encrypted. On macOS the
# wrapping key lives in Keychain; without a secure key other platforms fall
# back to metadata-only capture.
[observability]
enabled = true
capture_content = "full" # off | metadata | full
content_retention_days = 30
detail_retention_days = 180
backfill_days = 180
# master_key_env = "AGENTMUX_OBSERVABILITY_KEY"

# OTLP/HTTP JSON exporters have independent durable queues. Content is never
# exported unless include_content is explicitly enabled for that exporter.
# [[observability.exporters]]
# name = "local-otel"
# type = "otlp_http"
# protocol = "http/json"
# enabled = true
# endpoint = "http://127.0.0.1:4318"
# include_content = false
# timeout_seconds = 10
# queue_size = 10000

