# AgentNexus configuration (example). Copy to config.toml and edit.
# ${ENV_VAR} placeholders are expanded from the environment.

display_mode = "normal"  # quiet | compact | normal | full

[server]
addr = "127.0.0.1:8765"

[bridge]
enabled = false
# token = "${BRIDGE_TOKEN}"   # REQUIRED when enabled = true

# ---- Projects: pair an agent with one or more IM platforms ----
[[projects]]
name = "demo"
agent = "claudecode"
work_dir = "."
system_prompt = "You are a helpful coding assistant."

  [projects.env]
  # ANTHROPIC_API_KEY = "${MY_KEY}"

  [[projects.platforms]]
  type = "feishu"
  app_id = "${FEISHU_APP_ID}"
  app_secret = "${FEISHU_APP_SECRET}"

  # Other supported platform types (config.toml projects or the console's
  # Channels & Triggers panel):
  #   type = "lark"      -> app_id, app_secret (Lark international domain)
  #   type = "telegram"  -> token
  #   type = "dingtalk"  -> client_id, client_secret[, robot_code]
  #   type = "slack"     -> bot_token (xoxb-), app_token (xapp-)
  #   type = "discord"   -> token (enable Message Content Intent)
  #   type = "webhook"   -> listen, outbound_url
  # Channels created in the console are stored in SQLite and attached at
  # runtime; cron / inbound-webhook / event triggers are managed there too.

# ---- Lifecycle hooks (config.toml side; the console offers event triggers) ----
# Events: message.received, message.sent, session.started, session.ended,
#         cron.triggered, webhook.triggered, permission.requested, error
# [[hooks]]
# event = "error"
# type = "shell"
# command = "echo error >> /tmp/aib.log"

# ---- Provider management ----
[provider]
failover = true
# Local Routing listen address (cc-switch style takeover proxy). Live configs
# are rewritten to point here when takeover is enabled per tool.
# proxy_addr = "127.0.0.1:15733"

# ---- Token usage analytics ----
[usage]
sources = ["claude", "codex", "cursor", "gemini"]
offline = false
# cache_dir = "~/.cache/agentnexus"

