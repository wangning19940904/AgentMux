name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTMUX_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test Go packages
        run: go test ./...

      - name: Publish release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  publish-macos-desktop:
    name: Build and publish macOS desktop app (${{ matrix.arch }})
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build desktop app
        run: make desktop VERSION="${GITHUB_REF_NAME#v}" WAILS="$(go env GOPATH)/bin/wails"

      - name: Package and checksum desktop app
        run: |
          ARCH="$(go env GOARCH)"
          ASSET="agentmux-desktop_darwin_${ARCH}.zip"
          ditto -c -k --sequesterRsrc --keepParent desktop/build/bin/AgentMux.app "$ASSET"
          shasum -a 256 "$ASSET" >"$ASSET.sha256"
          echo "ASSET=$ASSET" >>"$GITHUB_ENV"

      - name: Upload desktop app to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" --clobber

  publish-python-sdk:
    name: Publish Python SDK to PyPI
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted Publishing: the `pypi` environment plus id-token permission is
    # all PyPI needs; no API token secret is involved.
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set SDK version from tag
        working-directory: sdk/python
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^__version__ = \".*\"/__version__ = \"${VERSION}\"/" src/agentmux_sdk/__init__.py
          grep '^__version__' src/agentmux_sdk/__init__.py

      - name: Test
        working-directory: sdk/python
        run: |
          uv sync
          uv run pytest -q

      - name: Build sdist and wheel
        working-directory: sdk/python
        run: uv build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist

  publish-typescript-sdk:
    name: Publish TypeScript SDK to npm
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted Publishing: npm exchanges the OIDC id-token for short-lived
    # publish credentials; no NPM_TOKEN secret is involved.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted Publishing requires npm >= 11.5.1; Node 20 bundles npm 10.
      - name: Update npm
        run: npm install -g npm@11.5.1

      - name: Set SDK version from tag
        working-directory: sdk/typescript
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      - name: Test and build
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm pack

      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: agentmux-sdk-npm
          path: sdk/typescript/agentmux-sdk-*.tgz

      - name: Publish to npm (Trusted Publishing)
        working-directory: sdk/typescript
        run: npm publish --access public
